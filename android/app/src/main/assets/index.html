<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pizza Offers Near Me</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root { --red:#C8102E; --ink:#1d1d1f; --muted:#6b6b70; --bg:#faf7f2; --card:#fff; --line:#ece6dc; --gold:#F4B942; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--red); color:#fff; padding:14px 16px 12px; position:sticky; top:0; z-index:1000; }
  header h1 { margin:0; font-size:19px; letter-spacing:.2px; }
  header .sub { font-size:12.5px; opacity:.9; margin-top:3px; }
  .bar { display:flex; gap:8px; margin-top:10px; }
  .bar select, .bar button, .bar input { border:0; border-radius:10px; padding:8px 10px; font-size:14px; }
  .bar input { flex:1; min-width:0; }
  .bar button { background:#fff; color:var(--red); font-weight:600; }
  #map { height:240px; border-bottom:1px solid var(--line); }
  main { padding:12px 12px 40px; }
  .status { font-size:13px; color:var(--muted); margin:4px 2px 10px; }
  .status.err { color:#a4161a; }
  h2 { font-size:15px; margin:18px 2px 8px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; }
  .shop { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:10px; }
  .shop-top { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
  .shop h3 { margin:0; font-size:16px; }
  .dist { background:#fff3d6; color:#7a4b00; font-size:12px; font-weight:700; padding:3px 8px; border-radius:20px; white-space:nowrap; }
  .addr { font-size:12.5px; color:var(--muted); margin-top:3px; }
  .offers { margin-top:10px; display:flex; flex-direction:column; gap:7px; }
  .offer { border-left:3px solid var(--gold); background:#fffaf0; padding:7px 9px; border-radius:6px; font-size:13.5px; }
  .offer small { display:block; color:var(--muted); font-size:12px; margin-top:2px; }
  .code { display:inline-flex; align-items:center; gap:6px; margin-top:5px; font-family:ui-monospace,monospace; font-weight:700; font-size:12.5px;
          border:1.5px dashed var(--red); color:var(--red); padding:2px 8px; border-radius:6px; background:#fff; }
  .none { font-size:13px; color:var(--muted); margin-top:8px; font-style:italic; }
  .stale { font-size:11.5px; color:#8a5a00; margin-top:6px; }
  .actions { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .actions a { text-decoration:none; font-size:13px; font-weight:600; padding:7px 11px; border-radius:9px; border:1px solid var(--line); color:var(--ink); background:#fff; }
  .actions a.primary { background:var(--red); color:#fff; border-color:var(--red); }
  .chip { font-size:11px; font-weight:700; color:#fff; background:var(--red); border-radius:5px; padding:1px 6px; margin-left:6px; vertical-align:2px; }
  .pin { font-size:24px; line-height:24px; text-align:center; }
  footer { font-size:11.5px; color:var(--muted); text-align:center; padding:8px 16px 24px; }
</style>
</head>
<body>
<header>
  <h1>🍕 Pizza Offers Near Me</h1>
  <div class="sub" id="sub">Today's deals from official pizza chain apps & sites</div>
  <div class="bar">
    <select id="radius" aria-label="Search radius">
      <option value="2000">2 km</option>
      <option value="5000" selected>5 km</option>
      <option value="10000">10 km</option>
      <option value="20000">20 km</option>
    </select>
    <input id="place" placeholder="Or type an area / city" />
    <button id="go">📍</button>
  </div>
</header>
<div id="map"></div>
<main>
  <div class="status" id="status">Finding your location…</div>
  <div id="list"></div>
</main>
<footer>Shops: © OpenStreetMap contributors · Offers: fetched daily from each chain's official website/app. Offers can vary by store — confirm at checkout.</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const OFFERS_URL = "https://raw.githubusercontent.com/chinmaybitsfilter-ctrl/Offer_Finder/main/data/offers.json";
const OVERPASS = ["https://overpass-api.de/api/interpreter", "https://overpass.kumi.systems/api/interpreter"];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const todayIST = () => new Date(Date.now() + 5.5 * 3600e3).toISOString().slice(0, 10);

let offersData = null, map = null, layer = null, here = null;

function setStatus(msg, err) { const s = $("status"); s.textContent = msg; s.className = "status" + (err ? " err" : ""); }

async function loadOffers() {
  try {
    const r = await fetch(OFFERS_URL + "?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw 0;
    offersData = await r.json();
  } catch {
    try { offersData = await (await fetch("offers.json")).json(); } catch { offersData = { brands: [] }; }
  }
  const d = offersData.date;
  $("sub").textContent = d === todayIST()
    ? `Today's deals · ${new Date().toLocaleDateString("en-IN", { weekday:"long", day:"numeric", month:"short" })}`
    : d ? `Offers last updated ${d} (today's update pending)` : "Offers not fetched yet";
}

function brandFor(tags) {
  const text = `${tags.name || ""} ${tags.brand || ""} ${tags["brand:en"] || ""}`;
  return (offersData?.brands || []).find((b) => new RegExp(b.match, "i").test(text)) || null;
}

function km(a, b) {
  const R = 6371, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}

async function findShops(lat, lng, radius) {
  const q = `[out:json][timeout:25];(
    nwr["cuisine"~"pizza",i](around:${radius},${lat},${lng});
    nwr["name"~"pizza|domino|pino|oven ?story|mojo",i](around:${radius},${lat},${lng});
    nwr["brand"~"pizza|domino|pino|oven ?story|mojo",i](around:${radius},${lat},${lng});
  );out center tags 120;`;
  let lastErr;
  for (const url of OVERPASS) {
    try {
      const r = await fetch(url, { method: "POST", body: "data=" + encodeURIComponent(q),
        headers: { "Content-Type": "application/x-www-form-urlencoded" } });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json();
      const seen = new Set();
      return j.elements
        .map((e) => ({ tags: e.tags || {}, lat: e.lat ?? e.center?.lat, lng: e.lon ?? e.center?.lon }))
        .filter((s) => s.tags.name && s.lat)
        .filter((s) => { const k = s.tags.name + s.lat.toFixed(4); if (seen.has(k)) return false; seen.add(k); return true; })
        .map((s) => ({ ...s, brand: brandFor(s.tags), dist: km({ lat, lng }, s) }))
        .sort((a, b) => a.dist - b.dist);
    } catch (e) { lastErr = e; }
  }
  throw lastErr;
}

function offerHtml(o) {
  return `<div class="offer">${esc(o.title)}${o.description ? `<small>${esc(o.description)}</small>` : ""}
    ${o.code ? `<div><span class="code" data-code="${esc(o.code)}">${esc(o.code)} ⧉</span></div>` : ""}</div>`;
}

function brandOffersHtml(b) {
  if (!b) return `<div class="none">Local shop — no online offers published. Call to ask about today's deal.</div>`;
  if (!b.offers?.length) return `<div class="none">No offers found on ${esc(b.name)}'s official site today.</div>`;
  return `<div class="offers">${b.offers.map(offerHtml).join("")}</div>` +
    (b.stale ? `<div class="stale">⚠ Couldn't refresh today — showing offers from ${esc(b.date)}.</div>` : "");
}

function addr(t) {
  return [t["addr:housenumber"], t["addr:street"], t["addr:suburb"] || t["addr:neighbourhood"], t["addr:city"]].filter(Boolean).join(", ");
}

function shopCard(s) {
  const t = s.tags, b = s.brand, phone = t.phone || t["contact:phone"];
  const dir = `https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}`;
  const n = b?.offers?.length || 0;
  return `<div class="shop">
    <div class="shop-top"><div><h3>${esc(t.name)}${n ? `<span class="chip">${n} offer${n > 1 ? "s" : ""}</span>` : ""}</h3>
      <div class="addr">${esc(addr(t) || (b ? b.name + " outlet" : "Pizza place"))}${t.opening_hours ? " · " + esc(t.opening_hours) : ""}</div></div>
      <span class="dist">${s.dist < 1 ? Math.round(s.dist * 1000) + " m" : s.dist.toFixed(1) + " km"}</span></div>
    ${brandOffersHtml(b)}
    <div class="actions">
      ${b ? `<a class="primary" href="${esc(b.website)}">Order on ${esc(b.name)}</a>` : ""}
      <a href="${dir}">Directions</a>
      ${phone ? `<a href="tel:${esc(phone.split(/[;,]/)[0].replace(/\s/g, ""))}">Call</a>` : ""}
    </div></div>`;
}

function render(shops, radius) {
  const list = $("list");
  const nearBrands = new Set(shops.filter((s) => s.brand).map((s) => s.brand.id));
  const withOffers = shops.filter((s) => s.brand?.offers?.length);
  const others = shops.filter((s) => !s.brand?.offers?.length);
  const missing = (offersData.brands || []).filter((b) => !nearBrands.has(b.id) && b.offers?.length);

  setStatus(shops.length
    ? `${shops.length} pizza place${shops.length > 1 ? "s" : ""} within ${radius / 1000} km · ${withOffers.length} with offers today`
    : `No pizza places found within ${radius / 1000} km. Try a bigger radius.`);

  let html = "";
  if (withOffers.length) html += `<h2>Offers near you</h2>` + withOffers.map(shopCard).join("");
  if (others.length) html += `<h2>Other pizza places</h2>` + others.map(shopCard).join("");
  if (missing.length) html += `<h2>Chain offers today (no outlet within ${radius / 1000} km — may still deliver)</h2>` +
    missing.map((b) => `<div class="shop"><div class="shop-top"><h3>${esc(b.name)}</h3></div>${brandOffersHtml(b)}
      <div class="actions"><a class="primary" href="${esc(b.website)}">Open ${esc(b.name)}</a></div></div>`).join("");
  list.innerHTML = html;

  layer.clearLayers();
  const pts = [[here.lat, here.lng]];
  L.circleMarker([here.lat, here.lng], { radius: 8, color: "#1a73e8", fillColor: "#1a73e8", fillOpacity: 1 }).addTo(layer).bindPopup("You are here");
  for (const s of shops) {
    const icon = L.divIcon({ className: "pin", html: s.brand?.offers?.length ? "🍕" : "📍", iconSize: [24, 24], iconAnchor: [12, 22] });
    L.marker([s.lat, s.lng], { icon }).addTo(layer)
      .bindPopup(`<b>${esc(s.tags.name)}</b><br>${s.brand?.offers?.length ? s.brand.offers.length + " offers today" : "No online offers"}`);
    pts.push([s.lat, s.lng]);
  }
  if (pts.length > 1) map.fitBounds(pts, { padding: [24, 24], maxZoom: 16 }); else map.setView(pts[0], 14);
}

async function search(lat, lng) {
  here = { lat, lng };
  const radius = +$("radius").value;
  if (!map) {
    map = L.map("map", { zoomControl: false }).setView([lat, lng], 14);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
    layer = L.layerGroup().addTo(map);
  }
  setStatus("Looking for pizza places around you…");
  try {
    if (!offersData) await loadOffers();
    render(await findShops(lat, lng, radius), radius);
  } catch (e) {
    setStatus("Couldn't load nearby shops (" + (e.message || "network error") + "). Check internet and tap 📍 to retry.", true);
  }
}

window.locate = function () {
  if ($("place").value.trim()) return searchPlace($("place").value.trim());
  setStatus("Finding your location…");
  if (!navigator.geolocation) return setStatus("Location not available — type an area or city above.", true);
  navigator.geolocation.getCurrentPosition(
    (p) => search(p.coords.latitude, p.coords.longitude),
    () => setStatus("Location permission is off. Allow location for Pizza Offers, or type an area / city above.", true),
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 120000 }
  );
};

async function searchPlace(q) {
  setStatus("Searching " + q + "…");
  try {
    const r = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=in&q=" + encodeURIComponent(q));
    const [hit] = await r.json();
    if (!hit) return setStatus("Couldn't find “" + q + "”. Try another name.", true);
    search(+hit.lat, +hit.lon);
  } catch { setStatus("Place search failed — check internet.", true); }
}

$("go").onclick = () => window.locate();
$("place").addEventListener("keydown", (e) => { if (e.key === "Enter") window.locate(); });
$("radius").onchange = () => here ? search(here.lat, here.lng) : window.locate();
document.addEventListener("click", (e) => {
  const c = e.target.closest(".code");
  if (!c) return;
  const code = c.dataset.code;
  if (window.Android) Android.copy(code); else navigator.clipboard?.writeText(code);
});

loadOffers().then(() => window.locate());
</script>
</body>
</html>
